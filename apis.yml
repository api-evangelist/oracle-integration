aid: oracle-integration
name: Oracle Integration
description: Oracle Integration provides native connectivity to Oracle and non-Oracle Software as a Service (SaaS) and on-premises
  applications, such as Oracle ERP Cloud, Oracle Service Cloud, HCM Cloud, Salesforce, Workday, EBS, SAP, NetSuite and others.
  It combines application integration, process automation, visual application building, and integration analytics into a single
  unified cloud service.
